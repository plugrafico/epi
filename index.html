<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qual é a sua Vertente na EPI?</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --accent: #1e40af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 28px;
            max-width: 480px;
            width: 100%;
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            color: var(--accent);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .progress {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-option {
            background-color: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
            text-align: left;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .btn-option:active {
            transform: scale(0.98);
            background-color: #e2e8f0;
        }

        .result-screen {
            display: none;
            text-align: center;
        }

        .profile-badge {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 16px;
        }

        .profile-desc {
            font-size: 0.98rem;
            line-height: 1.6;
            color: #334155;
            text-align: justify;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
        }

        .scores-list {
            text-align: left;
            background: #f1f5f9;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .scores-list div {
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .btn-restart {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="progress" id="progress-text">Pergunta 1 de 3</div>
        <div class="question-text" id="question-text">Carregando...</div>
        <div class="options-container" id="options-container"></div>
    </div>

    <div id="result-screen" class="result-screen">
        <h1>Seu Perfil de EPI</h1>
        <div class="profile-badge" id="profile-title"></div>
        <div class="profile-desc" id="profile-desc"></div>
        <div class="scores-list" id="scores-breakdown"></div>
        <button class="btn-restart" onclick="restartQuiz()">Refazer Questionário</button>
    </div>
</div>

<script>
    const questions = [
        {
            text: "É pior viver:",
            options: [
                { label: "1. Com medo", m: 1, l: 0, x: 0 },
                { label: "2. Sem liberdade", m: 0, l: 1, x: 0 },
                { label: "3. Com a desigualdade", m: 0, l: 0, x: 1 }
            ]
        },
        {
            text: "O que vale mais?",
            options: [
                { label: "1. A dignidade do indivíduo", m: 0, l: 1, x: 0 },
                { label: "2. O bem-estar da coletividade", m: 1, l: 0, x: 1 }
            ]
        },
        {
            text: "Como você define seu perfil em relação ao risco?",
            options: [
                { label: "1. Avesso ao risco", m: 1, l: 0, x: 0 },
                { label: "2. Aberto ao risco", m: 0, l: 1, x: 1 }
            ]
        }
    ];

    let currentQuestion = 0;
    let score = { m: 0, l: 0, x: 0 };

    function renderQuestion() {
        const q = questions[currentQuestion];
        document.getElementById("progress-text").innerText = `Pergunta ${currentQuestion + 1} de ${questions.length}`;
        document.getElementById("question-text").innerText = q.text;
        
        const container = document.getElementById("options-container");
        container.innerHTML = "";

        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "btn-option";
            btn.innerText = opt.label;
            btn.onclick = () => selectOption(opt);
            container.appendChild(btn);
        });
    }

    function selectOption(opt) {
        score.m += opt.m;
        score.l += opt.l;
        score.x += opt.x;

        currentQuestion++;
        if (currentQuestion < questions.length) {
            renderQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";

        let title = "";
        let desc = "";

        const { m, l, x } = score;

        if (m > l && m > x) {
            title = "Perfil Mercantilista";
        } else if (l > m && l > x) {
            title = "Perfil Liberal";
        } else if (x > m && x > l) {
            title = "Perfil Marxista";
        } else if (m === x && m > l) {
            title = "Perfil Misto: Mercantilista-Marxista";
        } else if (l === x && l > m) {
            title = "Perfil Misto: Liberal-Marxista";
        } else {
            title = "Perfil Misto: Todas as anteriores";
        }

        document.getElementById("profile-title").innerText = title;
        document.getElementById("profile-desc").innerText = desc;
        document.getElementById("scores-breakdown").innerHTML = `
            <div><strong>Pontuação Detalhada:</strong></div>
            <div>• Mercantilismo: ${m} ponto(s)</div>
            <div>• Liberalismo: ${l} ponto(s)</div>
            <div>• Marxismo: ${x} ponto(s)</div>
        `;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = { m: 0, l: 0, x: 0 };
        document.getElementById("quiz-screen").style.display = "block";
        document.getElementById("result-screen").style.display = "none";
        renderQuestion();
    }

    renderQuestion();
</script>

</body>
</html>
